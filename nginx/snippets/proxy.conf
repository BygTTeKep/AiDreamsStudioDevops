# Прокси в контейнер подпроекта. $upstream задаёт server-блок.
# Переменная в proxy_pass + resolver docker: nginx стартует, даже если подпроект ещё не поднят,
# и находит пересозданный контейнер без рестарта.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# WebSocket (/api/ws/generation)
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# долгие генерации и WebSocket; ответы и загрузки — потоком, без буфера на диске
proxy_read_timeout 1h;
proxy_send_timeout 1h;
proxy_buffering off;
proxy_request_buffering off;
